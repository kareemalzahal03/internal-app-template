# One project: the API's runtime, plus the dev group that never ships.
[project]
name = "internal-app"
version = "0.1.0"
description = "A template for internal web apps behind a company identity provider"
requires-python = "==3.15.*"
# Everything the API imports or runs, even if another package brings it too.
dependencies = [
    "authlib>=1.9.10",
    "beanie>=2.2.0",
    "fastapi>=0.165.0",
    "httptools>=0.9.0", # not imported: uvicorn's faster HTTP parser
    "httpx2>=2.16.2",
    "itsdangerous>=2.2.0", # not imported: Starlette's SessionMiddleware needs it
    "joserfc>=1.8.0",
    "pydantic-settings>=2.16.3",
    "pydantic[email]>=2.14.4",
    "pymongo>=4.20.1",
    "python-multipart>=0.0.34", # not imported: Starlette needs it to parse forms
    "starlette>=1.10.0",
    "uvicorn>=0.54.0", # not imported: the server the image runs
    # Not imported: uvicorn's faster event loop. It has no Windows build; uvicorn falls back to asyncio.
    "uvloop>=0.23.0; sys_platform != 'win32'",
    "watchfiles>=1.3.0", # not imported: uvicorn's --reload in the dev stack
]

[dependency-groups]
dev = [
    # Exact: any release can change what it reports.
    "pyrefly==1.5.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
    "types-authlib>=1.8.0.20261106",
]

[tool.uv]
# A floor, not a pin: uv can't switch its own version.
required-version = ">=0.13.9"

[tool.ruff]
# First-party roots, so `from app...` sorts as ours.
src = ["services/api"]
# Leave the READMEs' Python snippets as written.
extend-exclude = ["*.md"]
line-length = 100

[tool.ruff.lint]
# ANN requires annotations, which pyrefly does not.
extend-select = ["I", "UP", "B", "SIM", "FAST", "ASYNC", "RUF", "ANN"]
# FAST003 misreads path parameters consumed by a dependency as unused.
# ANN401 forbids a deliberate `Any`, which strict type checking allows.
ignore = ["FAST003", "ANN401"]

[tool.pyrefly]
# Where `app` is imported from.
search-path = ["services/api"]
# The recommended checks. Without it pyrefly uses its lenient `basic` preset.
preset = "default"

[tool.pyrefly.errors]
# A pyrefly: ignore that no longer suppresses anything fails the lint.
unused-ignore = "error"

[tool.pytest]
asyncio_mode = "auto"
# pytest-asyncio's future default, set only to silence its warning: every
# async fixture names its own loop_scope.
asyncio_default_fixture_loop_scope = "function"
testpaths = ["services/api/tests"]
